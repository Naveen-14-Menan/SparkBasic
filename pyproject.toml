[project]
name = "sparkbasic"
version = "0.1.0"
description = "PySpark data engineering practice project"
requires-python = ">=3.9"
dependencies = ["pyspark==3.5.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools]
# Flat layout for now; replaced by a src/ package in the next Phase 1 step.
py-modules = ["main", "config", "data_loader", "transformations"]
